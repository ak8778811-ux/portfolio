<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151829"/>
      <stop offset="100%" stop-color="#0d0f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <clipPath id="circle">
      <circle cx="150" cy="120" r="58"/>
    </clipPath>
  </defs>
  <!-- Background -->
  <rect width="300" height="300" rx="12" fill="url(#bg)"/>
  <!-- Decorative ring -->
  <circle cx="150" cy="120" r="62" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.6"/>
  <!-- Head silhouette -->
  <circle cx="150" cy="108" r="28" fill="#2d3250"/>
  <!-- Shoulders silhouette -->
  <ellipse cx="150" cy="162" rx="38" ry="22" fill="#2d3250"/>
  <!-- Inner glow ring -->
  <circle cx="150" cy="120" r="58" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.3"/>
  <!-- Label -->
  <text x="150" y="215" text-anchor="middle" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="500">Your Photo Here</text>
  <!-- Subtle hint -->
  <text x="150" y="238" text-anchor="middle" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10">Add profile.jpg to assets/</text>
  <!-- Decorative corner accents -->
  <line x1="20" y1="20" x2="45" y2="20" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>
  <line x1="20" y1="20" x2="20" y2="45" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>
  <line x1="280" y1="20" x2="255" y2="20" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>
  <line x1="280" y1="20" x2="280" y2="45" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>
  <line x1="20" y1="280" x2="45" y2="280" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>
  <line x1="20" y1="280" x2="20" y2="255" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>
  <line x1="280" y1="280" x2="255" y2="280" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>
  <line x1="280" y1="280" x2="280" y2="255" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>
</svg>
